name: CI

# The quality gate for every change. Render auto-deploys `main` on push and does
# NOT wait for GitHub checks, so branch protection requiring this `ci` check is
# what actually keeps a red build off the live site — once it's on, code can only
# reach `main` through a branch whose CI is green. One job so the required-check
# name stays stable ("ci"). The suite runs keyless by design — no secrets needed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # E05: the server-test tier boots the standalone build against a real
      # Postgres (structured data has no filesystem fallback anymore). This is
      # the ephemeral service container below — still keyless, no secrets.
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history: the frozen-manifest check diffs against the PR base
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: node scripts/check-frozen.mjs
      # Raw control bytes make `file` classify a source file as binary, which
      # makes grep skip it silently — so every grep-based guard here, and every
      # hand-run sweep, goes blind to it and says nothing. Twice now that has
      # hidden a live file from review. Cheap, full-tree, no deps.
      - run: node scripts/check-control-bytes.mjs
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server

      # E15 slice 5 — Lighthouse mobile performance budget (NFR-1 / M-18-02:
      # LCP < 2.5s on throttled 4G). Runs in THIS job to reuse the build and
      # the Postgres service container above rather than paying for a second
      # build. Measures a local production build, never the live site: a gate
      # that measured production would fail on someone else's traffic spike
      # and block a PR for a reason its author cannot act on.
      - name: Assemble the standalone bundle (what the Docker runner ships)
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/db && cp -r db/migrations .next/standalone/db/
      # Warm the standalone server's disk caches before Lighthouse measures it.
      # The first request to each page pays the app's cold external fetches
      # (weather.gov, NOAA tides, WSF ferry status — seconds from a CI runner)
      # plus the sharp image-optimizer transforms. That delay stretches the
      # page's observed streaming window, which balloons the set of requests
      # Lighthouse's Lantern simulation counts against LCP — measured locally
      # (fast fiber), a cold first run of / scores 0.86-0.87 where warm runs of
      # the SAME build score 0.88-0.90; on a CI runner the external fetches are
      # slower, so the cold penalty is larger. lhci boots its own server, so
      # run #1 of "/" was ALWAYS cold and the / median mixed the cold and warm
      # numbers on every PR. Both
      # the fetch cache and the image cache live on disk under
      # .next/standalone/.next/cache, so warmth from this throwaway server
      # process survives into the server lhci starts. This changes NO
      # assertion — it makes the lab measure the steady state prod actually
      # serves (a long-running warm server), instead of sometimes measuring
      # weather.gov's latency from a GitHub runner.
      - name: Warm the standalone server caches for Lighthouse
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ci-lighthouse-secret-0123456789abcdef
          PORT: "3000"
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          for u in / /ferry /eat /events; do
            curl -sf -o /dev/null "http://127.0.0.1:3000$u" || echo "warmup fetch failed for $u (non-fatal)"
          done
          # Best-effort teardown: a warmup server that already crashed must not
          # fail the step — lhci boots its own server either way, worst case cold.
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
      - name: Lighthouse budgets
        env:
          # The standalone server needs a real database — the pages being
          # measured read from it. Reuses the service container; the boot
          # migrator creates the schema on first start.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          AUTH_SECRET: ci-lighthouse-secret-0123456789abcdef
          PORT: "3000"
        run: npx lhci autorun
